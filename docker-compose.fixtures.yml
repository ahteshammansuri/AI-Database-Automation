# Fixture customer databases for the data-agent test suites (synthetic data only).
#   docker compose -f docker-compose.fixtures.yml up -d      # or: scripts/fixtures.sh up
#   docker compose -f docker-compose.fixtures.yml down -v    # wipe and re-seed on next up
# Both are bound to 127.0.0.1 and tuned for small memory. The credentials below exist only in
# these disposable containers; they are test infrastructure, not product configuration.
name: dataauto-fixtures

services:
  fixture-mysql:
    image: mysql:8.0
    container_name: dataauto-fx-mysql
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=4M
      - --performance-schema=OFF
      - --skip-name-resolve
      - --skip-log-bin
      - --max-connections=60
      - --table-open-cache=256
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
    environment:
      MYSQL_ROOT_PASSWORD: fxroot
    ports:
      - "127.0.0.1:3317:3306"
    volumes:
      - ./fixtures/sql/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pfxroot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  fixture-postgres:
    image: postgres:16-alpine
    container_name: dataauto-fx-postgres
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=60", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_PASSWORD: fxroot
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - ./fixtures/sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crmfx"]
      interval: 5s
      timeout: 5s
      retries: 40
